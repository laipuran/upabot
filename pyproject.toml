[project]
name = "duckbot"
version = "0.2.0"
description = "DuckBot business plugins for AstrBot and NapCat"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "aiosqlite>=0.21,<1",
    "pillow>=11.2.1,<14",
]

[dependency-groups]
dev = ["astrbot==4.29.3", "ruff==0.15.22"]
runtime = ["astrbot==4.29.3"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

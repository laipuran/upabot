name: duckbot-core

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  astrbot:
    image: ${ASTRBOT_IMAGE:-soulter/astrbot:v4.29.3}
    pull_policy: never
    container_name: duckbot-astrbot
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "${ASTRBOT_WEBUI_BIND:-127.0.0.1}:6185:6185"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./astrbot/data:/AstrBot/data
      - ./plugins/astrbot_plugin_duckbot:/AstrBot/data/plugins/astrbot_plugin_duckbot:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - qq

    dns:
      - 223.5.5.5    # 阿里云 DNS
      - 119.29.29.29  # 腾讯云 DNS

networks:
  qq:
    name: duckbot-qq
    external: true
